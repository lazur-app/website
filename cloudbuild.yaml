# Build the website image with its public build-time settings and deploy it to Cloud Run.
# Run: gcloud builds submit --config cloudbuild.yaml
substitutions:
  _REGION: us-central1
  _SERVICE: lazur-website
  _API_URL: https://api.lazur.app
  _MAC_URL: https://releases.lazur.app/Lazur_0.1.14_aarch64.dmg
  _MAC_URL_INTEL: https://releases.lazur.app/Lazur_0.1.14_x64.dmg
  _GA_ID: ""
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_SERVICE}:$BUILD_ID
      - --build-arg=NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_MAC_DOWNLOAD_URL=${_MAC_URL}
      - --build-arg=NEXT_PUBLIC_MAC_DOWNLOAD_URL_INTEL=${_MAC_URL_INTEL}
      - --build-arg=NEXT_PUBLIC_GA_MEASUREMENT_ID=${_GA_ID}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_SERVICE}:$BUILD_ID"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_SERVICE}:$BUILD_ID
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
# The image push can be slow; 30 minutes was cut too close (a deploy timed out mid-push).
timeout: 3600s
