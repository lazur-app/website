<!doctype html>
<!--
  Source for public/og-buddy.png, the link preview (WhatsApp, X, LinkedIn, iMessage, Slack).
  Re-render after editing:  node scripts/og/render.mjs
-->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Clash"; src: url("../../src/fonts/clash-display/ClashDisplay-Semibold.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Clash"; src: url("../../src/fonts/clash-display/ClashDisplay-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Sauce"; src: url("../../src/fonts/open-sauce-one/OpenSauceOne-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Sauce"; src: url("../../src/fonts/open-sauce-one/OpenSauceOne-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: "Sauce"; src: url("../../src/fonts/open-sauce-one/OpenSauceOne-SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: "Sauce"; src: url("../../src/fonts/open-sauce-one/OpenSauceOne-Bold.ttf"); font-weight: 700; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Sauce", sans-serif;
    color: #1c1917;
    background:
      radial-gradient(ellipse 55% 70% at 8% 0%, rgba(107, 75, 252, 0.16), transparent 70%),
      radial-gradient(ellipse 50% 60% at 100% 100%, rgba(249, 115, 22, 0.14), transparent 70%),
      #fffdfb;
    position: relative;
  }

  .copy { position: absolute; left: 72px; top: 70px; width: 500px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo img { width: 44px; height: 44px; }
  .logo span { font-weight: 700; font-size: 34px; letter-spacing: -0.045em; }
  .eyebrow {
    margin-top: 46px; display: inline-block; padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(28, 25, 23, 0.14); background: rgba(255, 255, 255, 0.75);
    font-size: 17px; font-weight: 500; color: #6b6560;
  }
  h1 {
    margin-top: 22px; font-family: "Clash", sans-serif; font-weight: 500;
    font-size: 54px; line-height: 1.02; letter-spacing: -0.035em; white-space: nowrap;
  }
  .sub { margin-top: 22px; font-size: 21px; line-height: 1.45; color: #57514c; width: 470px; }
  .url { position: absolute; left: 72px; bottom: 60px; font-size: 20px; font-weight: 600; color: #6b4bfc; }

  /* The Mac screen */
  .screen {
    position: absolute; left: 585px; top: 74px; width: 560px; height: 482px;
    border-radius: 22px; overflow: hidden;
    background: linear-gradient(135deg, #c9b8ff 0%, #f3c4dd 45%, #ffd2a8 100%);
    box-shadow: 0 30px 80px rgba(28, 25, 23, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.08);
  }
  .menubar {
    position: absolute; inset: 0 0 auto 0; height: 26px; padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255, 255, 255, 0.55); font-size: 12px; font-weight: 600; color: rgba(0, 0, 0, 0.75);
  }
  .menubar .left { display: flex; gap: 14px; align-items: center; }
  .menubar .left span:not(:nth-child(2)) { font-weight: 500; }
  .notch {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 300px; height: 64px; border-radius: 0 0 18px 18px; background: #000;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3); color: #fff; padding: 0 18px;
  }
  .notch .row { height: 30px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 500; }
  .bars { display: flex; gap: 3px; align-items: flex-end; height: 13px; }
  .bars i { width: 3px; border-radius: 3px; background: #fff; display: block; }
  .notch .said { text-align: center; font-size: 14.5px; font-weight: 600; margin-top: 2px; }

  .window {
    position: absolute; left: 44px; right: 44px; top: 96px; bottom: 44px;
    background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 18px 50px rgba(28, 25, 23, 0.18), 0 0 0 1px rgba(0, 0, 0, 0.05);
  }
  .titlebar { height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 16px; border-bottom: 1px solid rgba(0, 0, 0, 0.06); }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .title { margin-left: 10px; font-size: 12.5px; color: rgba(0, 0, 0, 0.55); font-weight: 500; }
  .tools { margin-left: auto; display: flex; gap: 8px; font-size: 12.5px; color: rgba(0, 0, 0, 0.55); }
  .tools span { padding: 4px 9px; border-radius: 7px; }
  .share { position: relative; background: rgba(0, 0, 0, 0.06); color: rgba(0, 0, 0, 0.8); font-weight: 600; }
  .circle { position: absolute; left: -14px; top: -11px; width: calc(100% + 28px); height: calc(100% + 22px); overflow: visible; }
  .pill {
    position: absolute; right: -10px; top: calc(100% + 14px); white-space: nowrap;
    background: #ffdcdc; color: #381212; border: 1px solid rgba(239, 83, 80, 0.35);
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  }
  .slide {
    position: absolute; left: 118px; right: 30px; top: 70px; bottom: 30px; border-radius: 10px;
    background: linear-gradient(135deg, #6b4bfc 0%, #a855f7 50%, #f97316 100%);
    color: #fff; padding: 22px; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .slide b { font-family: "Clash", sans-serif; font-weight: 600; font-size: 34px; line-height: 1; }
  .slide small { font-size: 13px; opacity: 0.85; margin-top: 6px; }
  .thumbs { position: absolute; left: 16px; top: 56px; width: 84px; display: flex; flex-direction: column; gap: 9px; }
  .thumbs div { aspect-ratio: 16 / 9; border-radius: 5px; background: #ece9f6; }
  .thumbs div:first-child { background: linear-gradient(135deg, #6b4bfc, #f97316); box-shadow: 0 0 0 2px #6b4bfc; }

  .pointer { position: absolute; left: 318px; top: 286px; width: 20px; }
  .sparkle { position: absolute; left: 418px; top: 150px; width: 22px; filter: drop-shadow(0 0 6px rgba(239, 83, 80, 0.7)); }
</style>
</head>
<body>
  <div class="copy">
    <div class="logo"><img src="../../public/logo.png" alt="" /><span>lazur</span></div>
    <div class="eyebrow">AI buddy for Mac</div>
    <h1>Your AI buddy,<br />right in the notch.</h1>
    <p class="sub">Hold a key and talk. It sees your screen, points at things and gets it done, in any app.</p>
  </div>
  <div class="url">lazur.app</div>

  <div class="screen">
    <div class="menubar">
      <div class="left"><svg viewBox="0 0 14 17" width="11" height="13" fill="currentColor"><path d="M11.6 9c0-2.1 1.7-3.1 1.8-3.2-1-1.5-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.7 0-1.7-.8-2.8-.7-1.4 0-2.8.8-3.5 2.1-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.6 2.2 2.7 2.2 1.1 0 1.5-.7 2.8-.7 1.3 0 1.7.7 2.8.7 1.2 0 1.9-1.1 2.6-2.1.8-1.2 1.2-2.4 1.2-2.4s-2.6-1-2.6-3.6zM9.5 2.8c.6-.7 1-1.7.9-2.8-.9 0-2 .6-2.6 1.4-.6.6-1.1 1.7-.9 2.7 1 .1 2-.5 2.6-1.3z"/></svg><span>Keynote</span><span>File</span><span>Edit</span><span>View</span></div>
      <div>Tue 9:41</div>
    </div>
    <div class="notch">
      <div class="row">
        <span>Speaking</span>
        <span class="bars"><i style="height:45%"></i><i style="height:100%"></i><i style="height:65%"></i><i style="height:85%"></i></span>
      </div>
      <div class="said">&ldquo;Top right. Right here.&rdquo;</div>
    </div>
    <div class="window">
      <div class="titlebar">
        <span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
        <span class="title">Launch deck</span>
        <div class="tools">
          <span>Play</span><span>Insert</span>
          <span class="share">Share
            <svg class="circle" viewBox="0 0 100 60" preserveAspectRatio="none">
              <path d="M52 4 C80 3 97 15 96 30 C95 47 74 57 49 56 C24 55 4 45 5 29 C6 14 25 5 58 6" fill="none" stroke="#ef5350" stroke-width="2.8" stroke-linecap="round" vector-effect="non-scaling-stroke" />
            </svg>
            <span class="pill">Share</span>
          </span>
        </div>
      </div>
      <div class="thumbs"><div></div><div></div><div></div><div></div></div>
      <div class="slide"><b>Q4 Launch</b><small>What we shipped, and what&rsquo;s next</small></div>
    </div>
    <svg class="pointer" viewBox="0 0 12 18"><path d="M1 1 L1 15 L4.5 11.6 L7 17 L9.2 16 L6.8 10.8 L11.5 10.8 Z" fill="#111" stroke="#fff" stroke-width="1" stroke-linejoin="round" /></svg>
    <svg class="sparkle" viewBox="0 0 24 24"><path d="M12 1.5 C12.6 7.4 16.6 11.4 22.5 12 C16.6 12.6 12.6 16.6 12 22.5 C11.4 16.6 7.4 12.6 1.5 12 C7.4 11.4 11.4 7.4 12 1.5 Z" fill="#ef5350" /></svg>
  </div>
</body>
</html>
